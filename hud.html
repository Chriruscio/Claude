<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S.</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%2345d4ff' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%2345d4ff'/%3E%3C/svg%3E">
<style>
  :root {
    --sfondo: #02070e;
    --sfondo-2: #06121f;
    --accento: #45d4ff;
    --accento-forte: #9be8ff;
    --testo: #cfe9f5;
    --testo-tenue: #5f7f93;
    --linea: rgba(69, 212, 255, 0.18);
    --velocita: 1;          /* moltiplicatore della rotazione degli anelli */
    --bagliore: 0.55;
  }

  /* Colori e ritmo per ogni stato */
  body[data-stato="ascolto"]      { --velocita: 1;   --bagliore: 0.55; }
  body[data-stato="attento"]      { --velocita: 1.6; --bagliore: 0.85; --accento: #6fe0ff; }
  body[data-stato="elaborazione"] { --velocita: 4;   --bagliore: 0.9;  --accento: #ffc857; --accento-forte: #ffe3a3; }
  body[data-stato="parla"]        { --velocita: 1.4; --bagliore: 1;    }
  body[data-stato="dorme"]        { --velocita: 0.25; --bagliore: 0.18; --accento: #4a6a80; --accento-forte: #6f8ea3; }
  body[data-stato="avvio"]        { --velocita: 0.6; --bagliore: 0.3; }
  body[data-stato="spento"],
  body[data-stato="offline"]      { --velocita: 0;   --bagliore: 0.12; --accento: #ff5a5a; --accento-forte: #ff9b9b; }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background:
      radial-gradient(ellipse at 50% 38%, var(--sfondo-2) 0%, var(--sfondo) 62%),
      var(--sfondo);
    color: var(--testo);
    font-family: "Segoe UI", "SF Pro Text", system-ui, sans-serif;
    overflow: hidden;
    display: grid;
    grid-template-rows: auto 1fr auto;
    transition: color 0.6s;
  }

  /* Griglia di fondo appena visibile */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--linea) 1px, transparent 1px),
      linear-gradient(90deg, var(--linea) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity: 0.18;
    mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
    pointer-events: none;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 20px 28px;
    font-family: Consolas, "SF Mono", ui-monospace, monospace;
    letter-spacing: 0.3em;
    font-size: 13px;
    color: var(--testo-tenue);
    position: relative;
  }
  header .nome { color: var(--accento); font-weight: 600; transition: color 0.6s; }
  #orologio { font-variant-numeric: tabular-nums; }

  main {
    display: grid;
    place-items: center;
    align-content: center;
    gap: 28px;
    position: relative;
    min-height: 0;
  }

  /* ---------------- Reattore ---------------- */
  .reattore {
    width: min(46vh, 80vw);
    aspect-ratio: 1;
    position: relative;
    filter: drop-shadow(0 0 calc(28px * var(--bagliore)) var(--accento));
    transition: filter 0.6s;
  }
  .reattore svg { width: 100%; height: 100%; overflow: visible; }
  .reattore circle, .reattore path { transition: stroke 0.6s, fill 0.6s, opacity 0.6s; }
  .t  { stroke: var(--accento); }
  .tf { stroke: var(--accento-forte); }
  .f  { fill: var(--accento); }
  .ff { fill: var(--accento-forte); }

  .anello { transform-origin: 50% 50%; transform-box: fill-box; }
  .gira-1 { animation: gira calc(40s / var(--velocita)) linear infinite; }
  .gira-2 { animation: gira calc(22s / var(--velocita)) linear infinite reverse; }
  .gira-3 { animation: gira calc(12s / var(--velocita)) linear infinite; }
  body[data-stato="spento"] .anello,
  body[data-stato="offline"] .anello { animation-play-state: paused; }

  @keyframes gira { to { transform: rotate(360deg); } }

  .nucleo {
    transform-origin: 50% 50%;
    transform-box: fill-box;
    animation: respira 3.2s ease-in-out infinite;
  }
  body[data-stato="parla"] .nucleo { animation: pulsa 0.42s ease-in-out infinite alternate; }
  body[data-stato="elaborazione"] .nucleo { animation: respira 0.9s ease-in-out infinite; }
  body[data-stato="dorme"] .nucleo { animation: respira 6s ease-in-out infinite; }

  @keyframes respira {
    0%, 100% { transform: scale(0.92); opacity: 0.75; }
    50%      { transform: scale(1);    opacity: 1; }
  }
  @keyframes pulsa {
    from { transform: scale(0.86); }
    to   { transform: scale(1.08); }
  }

  /* ---------------- Stato ---------------- */
  .stato {
    text-align: center;
    font-family: Consolas, "SF Mono", ui-monospace, monospace;
  }
  #etichetta {
    font-size: clamp(18px, 2.6vw, 26px);
    letter-spacing: 0.45em;
    padding-left: 0.45em;       /* compensa la spaziatura dell'ultima lettera */
    color: var(--accento-forte);
    transition: color 0.6s;
  }
  #dettaglio {
    margin-top: 8px;
    min-height: 1.2em;
    font-size: 13px;
    letter-spacing: 0.2em;
    color: var(--testo-tenue);
    text-transform: uppercase;
  }

  /* ---------------- Conversazione ---------------- */
  footer {
    padding: 0 28px 28px;
    display: flex;
    justify-content: center;
  }
  #storico {
    list-style: none;
    width: min(760px, 100%);
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 32vh;
    overflow: hidden;
    mask-image: linear-gradient(to bottom, transparent 0, #000 40px);
    justify-content: flex-end;
  }
  #storico li {
    display: grid;
    grid-template-columns: 74px 1fr;
    gap: 14px;
    align-items: baseline;
    font-size: 15px;
    line-height: 1.5;
    animation: entra 0.35s ease-out;
  }
  #storico .chi {
    font-family: Consolas, "SF Mono", ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--testo-tenue);
    text-align: right;
  }
  #storico li.jarvis .chi { color: var(--accento); }
  #storico li.utente .testo { color: #9fb6c4; }
  #storico li.jarvis .testo { color: var(--testo); }

  @keyframes entra {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .anello, .nucleo, #storico li { animation: none !important; }
  }

  @media (max-width: 560px) {
    header { padding: 16px; letter-spacing: 0.18em; }
    footer { padding: 0 16px 20px; }
    #storico li { grid-template-columns: 56px 1fr; gap: 10px; font-size: 14px; }
  }
</style>
</head>
<body data-stato="avvio">
  <header>
    <span class="nome">J.A.R.V.I.S.</span>
    <span id="orologio">--:--:--</span>
  </header>

  <main>
    <div class="reattore" aria-hidden="true">
      <svg viewBox="0 0 200 200">
        <!-- anello esterno tratteggiato -->
        <g class="anello gira-1">
          <circle cx="100" cy="100" r="94" fill="none" class="t" stroke-width="1"
                  stroke-dasharray="2 6" opacity="0.7"/>
          <circle cx="100" cy="100" r="88" fill="none" class="t" stroke-width="0.6" opacity="0.35"/>
        </g>
        <!-- anello a segmenti -->
        <g class="anello gira-2">
          <circle cx="100" cy="100" r="76" fill="none" class="t" stroke-width="5"
                  stroke-dasharray="38 10" opacity="0.55"/>
        </g>
        <!-- archi interni -->
        <g class="anello gira-3">
          <path d="M100 42 A58 58 0 0 1 158 100" fill="none" class="tf" stroke-width="2.2"
                stroke-linecap="round"/>
          <path d="M100 158 A58 58 0 0 1 42 100" fill="none" class="tf" stroke-width="2.2"
                stroke-linecap="round"/>
          <circle cx="100" cy="100" r="50" fill="none" class="t" stroke-width="0.8"
                  stroke-dasharray="1 3" opacity="0.6"/>
        </g>
        <!-- nucleo -->
        <g class="nucleo">
          <circle cx="100" cy="100" r="34" fill="none" class="t" stroke-width="1.5" opacity="0.8"/>
          <circle cx="100" cy="100" r="24" class="f" opacity="0.18"/>
          <circle cx="100" cy="100" r="14" class="ff" opacity="0.9"/>
        </g>
      </svg>
    </div>

    <div class="stato" role="status" aria-live="polite">
      <div id="etichetta">AVVIO</div>
      <div id="dettaglio"></div>
    </div>
  </main>

  <footer>
    <ul id="storico" aria-label="Conversazione"></ul>
  </footer>

<script>
  "use strict";

  const ETICHETTE = {
    avvio: "AVVIO",
    ascolto: "IN ASCOLTO",
    attento: "LA ASCOLTO, SIGNORE",
    elaborazione: "ELABORAZIONE",
    parla: "RISPOSTA",
    dorme: "IN RIPOSO",
    spento: "DISATTIVATO",
    offline: "COLLEGAMENTO ASSENTE",
  };
  const DETTAGLI = {
    ascolto: "dica “Jarvis”",
    dorme: "dica “Jarvis, svegliati”",
    offline: "J.A.R.V.I.S. non risponde",
  };

  const corpo = document.body;
  const etichetta = document.getElementById("etichetta");
  const dettaglio = document.getElementById("dettaglio");
  const storico = document.getElementById("storico");
  const orologio = document.getElementById("orologio");

  let versioneMostrata = -1;
  let ultimoSuccesso = Date.now();

  function mostraStato(stato, testoDettaglio) {
    corpo.dataset.stato = stato;
    etichetta.textContent = ETICHETTE[stato] || stato.toUpperCase();
    dettaglio.textContent = testoDettaglio || DETTAGLI[stato] || "";
  }

  // Il testo arriva dal riconoscimento vocale e dal modello: sempre textContent, mai innerHTML.
  function mostraStorico(voci) {
    storico.replaceChildren(...voci.slice(-6).map((voce) => {
      const riga = document.createElement("li");
      riga.className = voce.chi === "jarvis" ? "jarvis" : "utente";
      const chi = document.createElement("span");
      chi.className = "chi";
      chi.textContent = voce.chi === "jarvis" ? "JARVIS" : "TU";
      const testo = document.createElement("span");
      testo.className = "testo";
      testo.textContent = voce.testo;
      riga.append(chi, testo);
      return riga;
    }));
  }

  async function aggiorna() {
    try {
      const risposta = await fetch("/stato", { cache: "no-store" });
      if (!risposta.ok) throw new Error(risposta.status);
      const dati = await risposta.json();
      ultimoSuccesso = Date.now();
      mostraStato(dati.stato, dati.dettaglio);
      if (dati.versione !== versioneMostrata) {
        versioneMostrata = dati.versione;
        mostraStorico(dati.storico);
      }
    } catch (errore) {
      if (Date.now() - ultimoSuccesso > 2000 && corpo.dataset.stato !== "spento") {
        mostraStato("offline");
      }
    }
  }

  function aggiornaOrologio() {
    orologio.textContent = new Date().toLocaleTimeString("it-IT");
  }

  aggiorna();
  aggiornaOrologio();
  setInterval(aggiorna, 300);
  setInterval(aggiornaOrologio, 1000);
</script>
</body>
</html>
